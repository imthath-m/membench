name: mini
description: >
  Minimal smoke-test pack: state a couple of facts in one session,
  query them, then update a fact in a later session and re-query.

steps:
  - type: write
    session_id: s1
    id: m-color-blue
    fact_key: fact_color
    role: user
    content: "My favorite color is blue."
    fact_type: state
    timestamp: "2025-03-03T09:00:00+00:00"

  - type: write
    session_id: s1
    id: m-city-austin
    fact_key: fact_city
    role: user
    content: "I live in Austin."
    fact_type: state
    timestamp: "2025-03-03T09:01:00+00:00"

  - type: query
    session_id: s1
    query: "What is my favorite color?"
    expect_contains: ["blue"]
    expect_key: fact_color
    category: single_hop
    answer: "Blue"
    evidence: [m-color-blue]
    timestamp: "2025-03-03T09:05:00+00:00"

  - type: write
    session_id: s2
    id: m-color-green
    fact_key: fact_color
    role: user
    content: "Actually, my favorite color is green now."
    fact_type: update
    timestamp: "2025-05-12T18:20:00+00:00"

  - type: query
    session_id: s2
    query: "What is my favorite color now?"
    expect_contains: ["green"]
    expect_key: fact_color
    category: update
    answer: "Green"
    expect_absent: ["blue"]
    evidence: [m-color-green]
    timestamp: "2025-05-12T18:25:00+00:00"
    judge:
      semantic_recall: "The evidence indicates the user's current favorite color is green."
      contradiction: >
        The evidence contains contradictory statements about the user's
        favorite color, naming more than one different favorite color.

  - type: query
    session_id: s2
    query: "Where do I live?"
    expect_contains: ["Austin"]
    expect_key: fact_city
    category: single_hop
    answer: "Austin"
    evidence: [m-city-austin]
    timestamp: "2025-05-12T18:26:00+00:00"

  - type: write
    session_id: s2
    id: m-city-seattle
    fact_key: fact_city
    role: user
    content: "Actually, I moved to Seattle."
    fact_type: update
    timestamp: "2025-08-30T11:00:00+00:00"

  - type: query
    session_id: s2
    query: "Where do I live now?"
    expect_contains: ["Seattle"]
    expect_key: fact_city
    category: update
    answer: "Seattle"
    expect_absent: ["Austin"]
    evidence: [m-city-seattle]
    timestamp: "2025-08-30T11:05:00+00:00"
