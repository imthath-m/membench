name: customer_support
description: >
  A support agent remembering a customer (Dana Whitfield) across four
  tickets over five months: initial contact and profile, a plan upgrade
  with a corrected order number, a later shipping-address change plus
  contact preference, and an erasure request for her email address.
  Exercises state / update / contradict writes, a forget, temporal and
  unanswerable questions, and both deterministic (expect_contains /
  expect_key / expect_absent / evidence) and judge-scored queries.

steps:
  # --- Ticket 1 (session t1, 2025-01-14): first contact, build the profile ---
  - type: write
    session_id: t1
    id: cs-name
    fact_key: fact_name
    role: user
    content: "Hi, my name is Dana Whitfield."
    fact_type: state
    timestamp: "2025-01-14T10:02:00+00:00"

  - type: write
    session_id: t1
    id: cs-email
    fact_key: fact_email
    role: user
    content: "You can reach me at dana.whitfield@example.com."
    fact_type: state
    timestamp: "2025-01-14T10:03:00+00:00"

  - type: write
    session_id: t1
    id: cs-plan-basic
    fact_key: fact_plan
    role: user
    content: "I'm currently on the Basic plan."
    fact_type: state
    timestamp: "2025-01-14T10:04:00+00:00"

  - type: write
    session_id: t1
    id: cs-order-4471
    fact_key: fact_order
    role: user
    content: "I'm calling about order number ORD-4471."
    fact_type: state
    timestamp: "2025-01-14T10:05:00+00:00"

  - type: query
    session_id: t1
    query: "What is the customer's name?"
    expect_contains: ["Dana"]
    expect_key: fact_name
    category: single_hop
    answer: "Dana Whitfield"
    evidence: [cs-name]
    timestamp: "2025-01-14T10:10:00+00:00"

  - type: query
    session_id: t1
    query: "Which subscription plan is the customer on?"
    expect_contains: ["Basic"]
    expect_key: fact_plan
    category: single_hop
    answer: "Basic"
    evidence: [cs-plan-basic]
    timestamp: "2025-01-14T10:11:00+00:00"

  # --- Ticket 2 (session t2, 2025-02-20): plan upgrade + corrected order number ---
  - type: write
    session_id: t2
    id: cs-plan-pro
    fact_key: fact_plan
    role: user
    content: "I'd like to upgrade to the Pro plan, effective today."
    fact_type: update
    timestamp: "2025-02-20T14:30:00+00:00"

  - type: write
    session_id: t2
    id: cs-address-elm
    fact_key: fact_address
    role: user
    content: "Please ship to 22 Elm Street, Portland, OR 97201."
    fact_type: state
    timestamp: "2025-02-20T14:31:00+00:00"

  - type: write
    session_id: t2
    id: cs-order-7788
    fact_key: fact_order
    role: user
    content: "Actually I gave the wrong number earlier — my order is ORD-7788, not ORD-4471."
    fact_type: contradict
    timestamp: "2025-02-20T14:32:00+00:00"

  - type: query
    session_id: t2
    query: "Which subscription plan is the customer on now?"
    expect_contains: ["Pro"]
    expect_key: fact_plan
    category: update
    answer: "Pro"
    expect_absent: ["Basic"]
    evidence: [cs-plan-pro]
    timestamp: "2025-02-20T14:40:00+00:00"

  - type: query
    session_id: t2
    query: "What is the customer's correct order number?"
    expect_contains: ["ORD-7788"]
    expect_key: fact_order
    category: update
    answer: "ORD-7788"
    evidence: [cs-order-7788]
    timestamp: "2025-02-20T14:41:00+00:00"
    judge:
      semantic_recall: "The evidence indicates the customer's correct order number is ORD-7788."
      contradiction: >
        The evidence contains contradictory order numbers, naming more than
        one different order number for the same customer.

  # --- Ticket 3 (session t3, 2025-04-03): shipping change + contact preference ---
  - type: write
    session_id: t3
    id: cs-pref-email
    fact_key: fact_pref
    role: user
    content: "Going forward I prefer to be contacted by email rather than phone."
    fact_type: state
    timestamp: "2025-04-03T09:15:00+00:00"

  - type: write
    session_id: t3
    id: cs-address-oak
    fact_key: fact_address
    role: user
    content: "I've moved — please update shipping to 90 Oak Avenue, Seattle, WA 98101."
    fact_type: update
    timestamp: "2025-04-03T09:16:00+00:00"

  - type: query
    session_id: t3
    query: "What is the customer's current shipping address?"
    expect_contains: ["Oak Avenue", "Seattle"]
    expect_key: fact_address
    category: update
    answer: "90 Oak Avenue, Seattle, WA 98101"
    expect_absent: ["Elm Street"]
    evidence: [cs-address-oak]
    timestamp: "2025-04-03T09:20:00+00:00"

  - type: query
    session_id: t3
    query: "How does the customer prefer to be contacted?"
    expect_contains: ["email"]
    expect_key: fact_pref
    category: single_hop
    answer: "By email"
    evidence: [cs-pref-email]
    timestamp: "2025-04-03T09:21:00+00:00"

  - type: query
    session_id: t3
    query: "Summarize the customer's plan history."
    category: multi_hop
    answer: "She started on the Basic plan and upgraded to the Pro plan."
    evidence: [cs-plan-basic, cs-plan-pro]
    timestamp: "2025-04-03T09:22:00+00:00"
    judge:
      semantic_recall: >
        The evidence indicates the customer moved from the Basic plan to the
        Pro plan.
      contradiction: >
        The evidence names more than one current plan for the customer at the
        same time, without indicating one superseded the other.

  - type: query
    session_id: t3
    query: "Which plan was the customer on in early February 2025?"
    expect_contains: ["Basic"]
    category: temporal
    answer: "Basic"
    evidence: [cs-plan-basic]
    timestamp: "2025-04-03T09:23:00+00:00"

  - type: query
    session_id: t3
    query: "On what date did the customer upgrade to the Pro plan?"
    expect_contains: ["2025-02-20"]
    category: temporal
    answer: "February 20, 2025"
    evidence: [cs-plan-pro]
    timestamp: "2025-04-03T09:24:00+00:00"

  - type: query
    session_id: t3
    query: "What is the customer's phone number?"
    category: abstention
    abstain: true
    timestamp: "2025-04-03T09:25:00+00:00"

  # --- Ticket 4 (session t4, 2025-06-18): erasure request for the email address ---
  - type: write
    session_id: t4
    id: cs-erase-request
    fact_key: fact_erase
    role: user
    content: "Please delete my email address from your records."
    fact_type: state
    timestamp: "2025-06-18T16:00:00+00:00"

  - type: forget
    session_id: t4
    target: cs-email
    timestamp: "2025-06-18T16:01:00+00:00"

  - type: query
    session_id: t4
    query: "What is the customer's email address?"
    category: forget
    abstain: true
    expect_absent: ["dana.whitfield@example.com"]
    timestamp: "2025-06-18T16:05:00+00:00"
