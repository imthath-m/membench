[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "membench"
version = "0.1.0"
description = "Eval harness for agent memory backends."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MemBench contributors" }]
keywords = ["llm", "agents", "memory", "eval", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/imthath-m/membench"
Repository = "https://github.com/imthath-m/membench"
Issues = "https://github.com/imthath-m/membench/issues"

[project.optional-dependencies]
chroma = ["chromadb>=0.5"]
mem0 = ["mem0ai>=0.1"]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.0"]

[project.scripts]
membench = "membench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["membench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
