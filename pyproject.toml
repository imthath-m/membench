[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "membench"
version = "0.1.0"
description = "Eval harness for agent memory backends."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.5"]
dev = ["pytest>=8.0"]

[project.scripts]
membench = "membench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["membench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
