name: Release

# Publishes membench to PyPI with trusted publishing (OIDC; no API token).
# Runs only on a pushed `v*` tag or a manual dispatch; the tag must match the
# version in pyproject.toml. One-time setup: add this repository + workflow
# (`release.yml`, environment `pypi`) as a trusted publisher on pypi.org, and
# create the `pypi` environment (with required reviewers) in the repo settings.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version $version"
            exit 1
          fi

      - name: Test
        run: |
          pip install -e ".[dev]"
          ruff check .
          pytest

      - name: Build sdist + wheel
        run: |
          python -m build
          pip install twine
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
