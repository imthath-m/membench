name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install membench (dev extra)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Offline example run (no judge, no API key)
        run: membench run --backend full-context --pack customer-support --no-judge --out report.json

      - name: Verify example report
        run: |
          python -c "
          import json
          data = json.load(open('report.json'))
          assert data['pack_name'] == 'customer_support'
          assert data['backend_name'] == 'full-context'
          assert data['scores']['recall_precision'] is not None
          print('offline example run produced a valid report')
          "

  chroma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install membench (dev + chroma extras)
        run: pip install -e ".[dev,chroma]"

      - name: Test chroma adapter
        run: pytest tests/test_chroma_adapter.py tests/test_chroma_reset.py -rs

      - name: Offline chroma example run (no judge, no API key)
        run: membench run --backend chroma --pack customer-support --no-judge --out report.json
