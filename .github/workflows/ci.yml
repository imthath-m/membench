name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install membench (dev extra)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Offline example run (no judge, no API key)
        run: membench run --backend full-context --pack customer-support --no-judge --out report.json

      - name: Verify example report
        run: |
          python -c "
          import json
          data = json.load(open('report.json'))
          assert data['pack_name'] == 'customer_support'
          assert data['backend_name'] == 'full-context'
          assert data['scores']['recall_precision'] is not None
          import jsonschema
          jsonschema.validate(data, json.load(open('membench/report.schema.json')))
          print('offline example run produced a valid report')
          "

      - name: Rescore committed report offline (no adapter, no network)
        run: |
          membench rescore --in tests/fixtures/report_customer_support.json \
            --judge-cache tests/fixtures/judge_cache_customer_support.json --check

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: uv.lock is up to date with pyproject.toml
        run: uv lock --check

  chroma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install membench (dev + chroma + tokens extras)
        run: pip install -e ".[dev,chroma,tokens]"

      - name: Test chroma adapter + tiktoken tokenizer
        run: |
          pytest tests/test_chroma_adapter.py tests/test_chroma_reset.py tests/test_adapter_contract.py \
            tests/test_report_schema.py tests/test_tokens.py -rs

      - name: Offline chroma example run (no judge, no API key)
        run: membench run --backend chroma --pack customer-support --no-judge --out report.json
